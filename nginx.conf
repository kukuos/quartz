# ============================================================================
#  Nginx 配置 —— notes.231652.xyz （Quartz 静态知识库 / 宝塔面板）
# ============================================================================
#
#  本文件是在宝塔自动生成的站点配置基础上改的，保留了它的全部标记块
#  （CERT-APPLY-CHECK / SSL / ERROR-PAGE / PHP-INFO / REWRITE 以及自带的
#  敏感文件拦截规则），因此面板上的 SSL、伪静态、证书续期等功能都不受影响。
#
#  在此之上补充了四类静态站点必需的配置：
#    1. URL 路由     —— Quartz 产物是 docker.html，网址却是 /docker，
#                       没有 try_files 的话所有内页都会 404
#    2. UTF-8 声明   —— 中文标题和中文文件名
#    3. 分级缓存     —— 带 hash 的资源长期强缓存，HTML 不缓存
#    4. gzip 压缩
#
#  ⚠ 两个 nginx 语法坑（本文件已规避，改动时注意）：
#    · 正则里出现 { } 必须用双引号把整个正则括起来，否则 nginx 会把它
#      当成配置块的括号，报 unknown directive
#    · charset_types 不能再写 text/html，nginx 默认已包含，重复会告警
#
#  ⚠ 正则 location 按「书写顺序」匹配，先匹配到的生效。
#    带 hash 的资源规则必须排在宝塔自带的 js|css 规则之前，否则不生效。
# ============================================================================

server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;
    server_name notes.231652.xyz;
    # 纯静态站点，只需要 index.html
    index index.html;
    root /www/wwwroot/notes.231652.xyz;

    # 中文标题、中文文件名必须声明 UTF-8，否则部分浏览器会按 GBK 解析导致乱码。
    # 注意：charset_types 里不要写 text/html，nginx 默认已包含，重复会产生告警。
    charset utf-8;
    charset_types text/css text/xml application/javascript application/json application/rss+xml;

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/notes.231652.xyz.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/notes.231652.xyz/*.conf;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate    /www/server/panel/vhost/cert/notes.231652.xyz/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/notes.231652.xyz/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    quic_retry on;
    quic_gso on;
    ssl_early_data on;
    error_page 497  https://$host$request_uri;

    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    # Quartz 会生成 404.html，直接用作自定义 404 页
    error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    include enable-php-00.conf;
    #PHP-INFO-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/notes.231652.xyz.conf;
    #REWRITE-END

    # ------------------------------------------------------------------
    #  安全响应头
    #  站点纯静态、无表单、无 Cookie，策略可以收得比较紧
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------------
    #  压缩
    # ------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/atom+xml
        image/svg+xml font/ttf font/otf;

    # ------------------------------------------------------------------
    #  URL 路由（本站点最关键的一段，没有它所有内页都会 404）
    #
    #  Quartz 5 的实际产物结构（实测确认，与旧版 v4 教程不同）：
    #      公共/Docker.md       -> docker.html        -> 网址 /docker
    #      公共/中文标题测试.md  -> 中文标题测试.html   -> 网址 /中文标题测试
    #      标签页 / 目录页       -> tags/index.html    -> 网址 /tags/
    #  文件名转小写，网址不带 .html、不带尾部斜杠。
    #  大写写法（/Docker）由 Quartz 生成的重定向页兜底，同样可访问。
    #
    #  每个页面都有真实文件，因此不做 SPA 式的「全部回退到 index.html」，
    #  让不存在的路径返回真正的 404，对 SEO 更友好。
    # ------------------------------------------------------------------
    autoindex off;

    location / {
        # $uri 以斜杠结尾时 nginx 按目录处理，所以 /tags/ 会命中 tags/index.html，
        # 无需额外重定向（sitemap 里的 /tags/ 因此能直接返回 200）。
        try_files $uri $uri.html $uri/index.html @strip_slash;

        # 页面不缓存，发布后立即可见。
        # 这一条不能只靠下面的 \.html$ 规则：location 匹配的是 URI，
        # 首页 URI 是 /、内页 URI 是 /docker，都不以 .html 结尾，命中不了。
        #
        # 这里用 expires 指令而不是 add_header Cache-Control，是因为 nginx 的
        # add_header 一旦出现在子块中，父块（server）里的 add_header 就全部
        # 不再继承——那样会把上面三个安全响应头弄丢。
        # expires -1 会输出 Cache-Control: no-cache，且不影响继承。
        expires -1;
    }

    # /docker/ -> 301 -> /docker。用 permanent 而非 last：新地址不带尾斜杠，
    # 不会与上面的规则形成循环；真正不存在的路径最终仍返回 404。
    location @strip_slash {
        rewrite ^/(.+)/$ /$1 permanent;
        return 404;
    }

    # ------------------------------------------------------------------
    #  缓存策略
    #  ⚠ 以下三条必须排在宝塔自带的图片、js|css 缓存规则之前，
    #    否则会被那两条先匹配掉。
    # ------------------------------------------------------------------

    # 带内容 hash 的构建产物：内容一变文件名就变，可放心长期强缓存。
    # 正则含 {6,}，必须用双引号括起来，否则 nginx 会把花括号当配置块。
    # 这里为了加 immutable 不得不用 add_header，因而丢失父块继承，
    # 所以把 nosniff 补回来（静态资源最需要的就是这一条）。
    location ~* "^/(prescript|postscript|index|component)-[0-9a-f]{6,}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # 直接访问 .html 结尾的地址时同样不缓存
    location ~* \.html$ {
        expires -1;
    }

    # 图片与媒体。比宝塔自带规则多覆盖 webp/svg/avif 等格式
    # （Quartz 生成的社交分享图就是 webp）。
    # 只用 expires，不写 add_header，以保留 server 块的安全响应头。
    location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|bmp|mp4|webm|mp3|wav|ogg|m4a)$ {
        expires 30d;
        access_log off;
    }

    # 字体
    location ~* \.(woff2?|ttf|otf|eot)$ {
        expires 30d;
        access_log off;
    }

    # RSS / sitemap / robots：短缓存并确保 MIME 正确。
    # expires 1h 本身就会输出 Cache-Control: max-age=3600，
    # 无需再写 add_header，这样也不会破坏安全头的继承。
    location = /index.xml {
        expires 1h;
        default_type "application/rss+xml; charset=utf-8";
    }
    location = /sitemap.xml {
        expires 1h;
        default_type "application/xml; charset=utf-8";
    }
    location = /robots.txt {
        expires 1d;
        default_type "text/plain; charset=utf-8";
    }

    # 搜索索引体积较大，允许缓存但每次校验
    location = /static/contentIndex.json {
        expires 1h;
        add_header Cache-Control "public, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        default_type "application/json; charset=utf-8";
    }

    # ------------------------------------------------------------------
    #  以下为宝塔自带的防护与缓存规则，保持原样。
    #  站点目录里只有构建产物，Quartz 源码、node_modules、.git 都在
    #  /www/app/quartz，本来就不在 Nginx 可访问范围内；这些规则是
    #  防误操作的第二道防线。
    # ------------------------------------------------------------------

    # 禁止访问的敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }

    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    # 补充：Markdown 原文与脚本源码，即使误放进站点目录也不可访问
    location ~* \.(md|markdown|ts|tsx|scss|lock|sh|ps1|sql|ini)$ {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    access_log  /www/wwwlogs/notes.231652.xyz.log;
    error_log  /www/wwwlogs/notes.231652.xyz.error.log;
}
