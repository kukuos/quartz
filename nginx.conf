# ============================================================================
#  Nginx 配置 —— notes.231652.xyz （Quartz 静态知识库）
# ============================================================================
#
#  【使用方法】宝塔面板
#
#   1. 网站 → 添加站点
#        域名：notes.231652.xyz
#        根目录：/www/wwwroot/notes.231652.xyz
#        PHP 版本：纯静态
#
#   2. 站点设置 → SSL → Let's Encrypt → 勾选域名 → 申请
#      申请成功后打开「强制 HTTPS」。
#      宝塔会自动把证书路径写进下面的 SSL-START / SSL-END 区块。
#
#   3. 站点设置 → 配置文件 → 用本文件内容替换
#      ⚠ 关键：不要动 #SSL-START 到 #SSL-END 之间宝塔自动生成的内容，
#        把你面板里已有的那几行原样保留在对应位置，否则证书会失效。
#
#   4. 保存后宝塔会自动执行 nginx -t 并 reload。
#
#  【为什么这样配】
#   · 站点根目录只放构建产物（纯 HTML/CSS/JS/图片）。
#     Quartz 源码、node_modules、.git、package.json 都在 /www/app/quartz，
#     根本不在 Nginx 的可访问路径下 —— 这是最强的隔离，比 deny 规则更可靠。
#     下面的 deny 规则是第二道防线，防止误操作把源码放进站点目录。
#   · 产物不含任何 .md 文件，Markdown 原文天然不会暴露。
#   · 静态资源文件名带内容 hash（如 index-bb6c1746.css），内容一变文件名就变，
#     所以可以放心用一年期强缓存；HTML 则不缓存，保证发布后立刻可见。
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name notes.231652.xyz;

    # HTTP 全部跳转到 HTTPS
    # 注意：Let's Encrypt 续期验证走 /.well-known/acme-challenge/，必须放行
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/notes.231652.xyz;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name notes.231652.xyz;

    root  /www/wwwroot/notes.231652.xyz;
    index index.html;

    # 中文标题、中文文件名的页面必须声明 UTF-8，否则浏览器可能按 GBK 解析
    charset utf-8;
    charset_types text/html text/css text/xml application/javascript application/json application/rss+xml;

    # ------------------------------------------------------------------
    #SSL-START  以下由宝塔面板自动生成，申请证书后请保留面板里的原始内容
    # ssl_certificate     /www/server/panel/vhost/cert/notes.231652.xyz/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/notes.231652.xyz/privkey.pem;
    #SSL-END
    # ------------------------------------------------------------------

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---------------- 安全响应头 ----------------
    # 站点是纯静态、无表单、无 Cookie，所以策略可以收得比较紧
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # HSTS：确认 HTTPS 工作正常后再启用（启用后浏览器一年内强制走 HTTPS，不易撤销）
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # ---------------- 压缩 ----------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/atom+xml
        image/svg+xml font/ttf font/otf;

    # Brotli：宝塔的 Nginx 默认未编译 ngx_brotli 模块。
    # 如果你在宝塔「软件商店 → Nginx → 设置」里加装了 brotli，取消下面注释即可。
    # 没有 brotli 也不影响，gzip 对 HTML/CSS/JS 已经够用。
    # brotli            on;
    # brotli_comp_level 6;
    # brotli_types      text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # ---------------- 路由 ----------------
    # Quartz 5 的 URL 规则（实测确认，与 v4 教程不同）：
    #   公共/Docker.md        ->  文件 docker.html      ->  网址 /docker
    #   公共/中文标题测试.md   ->  文件 中文标题测试.html ->  网址 /中文标题测试
    #   目录页 / 标签页        ->  文件 tags/index.html  ->  网址 /tags/
    # 也就是说：文件名会转成小写，网址不带 .html、不带尾部斜杠。
    # 大写写法（/Docker）由 Quartz 生成的重定向页兜底，同样可以访问。
    #
    # 每个页面都有真实文件，所以不做 SPA 式的「全部回退到 index.html」，
    # 让不存在的路径返回真正的 404，对 SEO 更友好。
    autoindex off;

    location / {
        # $uri 以斜杠结尾时 nginx 按目录处理，所以 /tags/ 会命中 tags/index.html，
        # 无需额外重定向（sitemap 里的 /tags/ 因此能直接返回 200）。
        # 找不到时交给 @strip_slash，处理「给扁平页面误加尾斜杠」的情况。
        try_files $uri $uri.html $uri/index.html @strip_slash;
    }

    # /test/ -> 301 -> /test。用 permanent 而非 last，新地址不再带尾斜杠，
    # 不会与上面的规则形成循环；真正不存在的路径最终仍返回 404。
    location @strip_slash {
        rewrite ^/(.+)/$ /$1 permanent;
        return 404;
    }

    # 带内容 hash 的构建产物：长期强缓存
    location ~* ^/(prescript|postscript|index|component)-[0-9a-f]{6,}\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # 其他静态资源：中等缓存
    location ~* \.(js|css|woff2?|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    # 图片与媒体
    location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|bmp|mp4|webm|mp3|wav|ogg|m4a)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    # HTML 不缓存：发布后立即生效，不用让访客清缓存
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # RSS 与 sitemap：短缓存，并确保 MIME 正确
    location = /index.xml {
        expires 1h;
        add_header Cache-Control "public" always;
        types { } default_type "application/rss+xml; charset=utf-8";
    }
    location = /sitemap.xml {
        expires 1h;
        add_header Cache-Control "public" always;
        types { } default_type "application/xml; charset=utf-8";
    }
    location = /robots.txt {
        expires 1d;
        types { } default_type "text/plain; charset=utf-8";
    }

    # 搜索索引：体积较大，允许缓存但需校验
    location = /static/contentIndex.json {
        expires 1h;
        add_header Cache-Control "public, must-revalidate" always;
        types { } default_type "application/json; charset=utf-8";
    }

    # ---------------- 防御规则（第二道防线） ----------------
    # 正常情况下这些文件根本不在站点目录里，规则用于兜底防误操作。

    # 版本控制与依赖目录
    location ~ /\.git(/|$)      { deny all; return 404; }
    location ~ /node_modules(/|$) { deny all; return 404; }

    # 所有点开头的隐藏文件（.env / .npmrc / .user.ini / .DS_Store 等）
    # 例外：ACME 验证目录必须可访问，已在上面单独放行
    location ~ /\.(?!well-known) { deny all; return 404; }

    # Markdown 原文与项目源码，即使误放进站点目录也不可访问
    location ~* \.(md|markdown|ts|tsx|scss|lock|log|sh|ps1|bak|sql|conf|ini|yaml|yml)$ {
        deny all;
        return 404;
    }
    location ~* ^/(package(-lock)?\.json|tsconfig\.json|Dockerfile|quartz\.config\..*)$ {
        deny all;
        return 404;
    }

    # ---------------- 错误页 ----------------
    # Quartz 会生成 404.html，用它作为自定义 404 页面
    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
        add_header Cache-Control "no-cache" always;
    }

    # ---------------- 日志 ----------------
    access_log /www/wwwlogs/notes.231652.xyz.log;
    error_log  /www/wwwlogs/notes.231652.xyz.error.log;
}
