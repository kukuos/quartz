# ============================================================================
#  Nginx 配置 —— notes.231652.xyz （Quartz 静态知识库 / 宝塔面板）
# ============================================================================
#
#  ⚠ 操作顺序很重要，请严格按 1→2→3 来，顺序反了会导致 nginx -t 失败：
#
#   第 1 步：网站 → 添加站点
#       域名：notes.231652.xyz
#       根目录：/www/wwwroot/notes.231652.xyz
#       PHP 版本：纯静态
#       （此时用宝塔默认配置，网站应该已经能通过 http 访问）
#
#   第 2 步：站点设置 → SSL → Let's Encrypt → 勾选域名 → 申请
#       申请成功后打开「强制 HTTPS」。
#       这一步会由宝塔生成证书文件和下面用到的 well-known 配置，
#       必须先做完，否则第 3 步替换配置后 nginx 会因找不到文件而报错。
#
#   第 3 步：站点设置 → 配置文件 → 用本文件内容替换 → 保存
#       保存时宝塔会自动执行 nginx -t 并 reload。
#       如果报错，点「回退」恢复上一版配置即可，网站不会中断。
#
#   第 4 步：建站时宝塔可能往站点目录放了默认首页，重新部署一次覆盖：
#       bash /www/app/quartz/deploy.sh
#
#  ----------------------------------------------------------------------------
#  【本配置做了什么】
#   · 保留宝塔的全部标记块（SSL、证书申请验证、错误页、扩展配置），
#     所以面板上的「强制HTTPS」「SSL续期」等开关仍然正常工作。
#   · 在此基础上加入静态站点优化：UTF-8、gzip、分级缓存、干净的 URL 路由。
#   · 站点根目录只有构建产物；Quartz 源码、node_modules、.git 都在
#     /www/app/quartz，本来就不在 Nginx 可访问范围内。下面的 deny 规则
#     只是防误操作的第二道防线。
# ============================================================================

server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;
    server_name notes.231652.xyz;
    index index.html;
    root /www/wwwroot/notes.231652.xyz;

    # 中文标题、中文文件名必须声明 UTF-8，否则部分浏览器会按 GBK 解析导致乱码
    charset utf-8;
    charset_types text/html text/css text/xml application/javascript application/json application/rss+xml;

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/notes.231652.xyz.conf;
    #CERT-APPLY-CHECK--END

    include /www/server/panel/vhost/nginx/extension/notes.231652.xyz/*.conf;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    # ⚠ 以下整段由宝塔在申请证书、开启「强制HTTPS」时自动生成。
    #   替换配置文件时，请把你面板里原有的这一段原样保留，不要用本文件的版本覆盖，
    #   否则证书路径可能对不上。下面保留的是宝塔的标准写法，供对照。
    #error_page 404/404.html;
    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate    /www/server/panel/vhost/cert/notes.231652.xyz/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/notes.231652.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc 'h3=":443"; ma=86400';
    quic_retry on;
    ssl_early_data on;
    error_page 497  https://$host$request_uri;
    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    # Quartz 会生成 404.html，直接用它作为自定义 404 页
    error_page 404 /404.html;
    #ERROR-PAGE-END

    # ------------------------------------------------------------------
    #  安全响应头
    #  站点纯静态、无表单、无 Cookie，策略可以收得比较紧
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------------
    #  压缩
    # ------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/atom+xml
        image/svg+xml font/ttf font/otf;

    # Brotli：宝塔自带的 Nginx 默认未编译 ngx_brotli。
    # 若在「软件商店 → Nginx → 设置」中加装了该模块，可取消下面注释。
    # 没有也不影响，gzip 对 HTML/CSS/JS 已经足够。
    # brotli            on;
    # brotli_comp_level 6;
    # brotli_types      text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # ------------------------------------------------------------------
    #  路由
    #
    #  Quartz 5 的实际产物结构（实测确认，与旧版 v4 教程不同）：
    #      公共/Docker.md       -> docker.html        -> 网址 /docker
    #      公共/中文标题测试.md  -> 中文标题测试.html   -> 网址 /中文标题测试
    #      标签页 / 目录页       -> tags/index.html    -> 网址 /tags/
    #  文件名会转为小写，网址不带 .html、不带尾部斜杠。
    #  大写写法（/Docker）由 Quartz 生成的重定向页兜底，同样可访问。
    #
    #  每个页面都有真实文件，因此不做 SPA 式的「全部回退到 index.html」，
    #  让不存在的路径返回真正的 404，对 SEO 更友好。
    # ------------------------------------------------------------------
    autoindex off;

    location / {
        # $uri 以斜杠结尾时 nginx 按目录处理，所以 /tags/ 会命中 tags/index.html，
        # 无需额外重定向（sitemap 里的 /tags/ 因此能直接返回 200）。
        try_files $uri $uri.html $uri/index.html @strip_slash;
    }

    # /docker/ -> 301 -> /docker。用 permanent 而非 last：新地址不再带尾斜杠，
    # 不会与上面的规则形成循环；真正不存在的路径最终仍返回 404。
    location @strip_slash {
        rewrite ^/(.+)/$ /$1 permanent;
        return 404;
    }

    # ------------------------------------------------------------------
    #  缓存策略
    #  带内容 hash 的文件（如 index-bb6c1746.css）内容一变文件名就变，
    #  可以放心长期强缓存；HTML 不缓存，保证发布后立刻可见。
    # ------------------------------------------------------------------
    location ~* ^/(prescript|postscript|index|component)-[0-9a-f]{6,}\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location ~* \.(js|css|woff2?|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|bmp|mp4|webm|mp3|wav|ogg|m4a)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # RSS / sitemap / robots：短缓存并确保 MIME 正确
    location = /index.xml {
        expires 1h;
        add_header Cache-Control "public" always;
        default_type "application/rss+xml; charset=utf-8";
    }
    location = /sitemap.xml {
        expires 1h;
        add_header Cache-Control "public" always;
        default_type "application/xml; charset=utf-8";
    }
    location = /robots.txt {
        expires 1d;
        default_type "text/plain; charset=utf-8";
    }

    # 搜索索引体积较大，允许缓存但每次校验
    location = /static/contentIndex.json {
        expires 1h;
        add_header Cache-Control "public, must-revalidate" always;
        default_type "application/json; charset=utf-8";
    }

    # ------------------------------------------------------------------
    #  防御规则（第二道防线）
    #  正常情况下这些文件根本不在站点目录里，规则用于兜底防误操作。
    # ------------------------------------------------------------------
    location ~ /\.git(/|$)        { deny all; return 404; }
    location ~ /node_modules(/|$) { deny all; return 404; }

    # 所有点开头的隐藏文件（.env / .npmrc / .user.ini / .DS_Store 等）。
    # 例外：.well-known 必须放行，证书申请和续期要用。
    location ~ /\.(?!well-known) { deny all; return 404; }

    # Markdown 原文与项目源码，即使误放进站点目录也不可访问
    location ~* \.(md|markdown|ts|tsx|scss|lock|log|sh|ps1|bak|sql|conf|ini|ya?ml)$ {
        deny all;
        return 404;
    }
    location ~* ^/(package(-lock)?\.json|tsconfig\.json|Dockerfile|quartz\.config\..*)$ {
        deny all;
        return 404;
    }

    # ------------------------------------------------------------------
    #  日志
    # ------------------------------------------------------------------
    access_log /www/wwwlogs/notes.231652.xyz.log;
    error_log  /www/wwwlogs/notes.231652.xyz.error.log;
}
